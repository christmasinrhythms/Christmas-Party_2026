<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7ebdf">
<meta name="description" content="Christmas in Rhythms — coming soon.">
<title>Christmas in Rhythms</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f7ebdf;overflow:hidden}body{font-family:system-ui,sans-serif}main{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(ellipse,#fcf1e6,#f5e7da)}.film-poster,.film-video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:center;transform:none}.film-video{opacity:0}.film-video.has-played{opacity:1}[hidden]{display:none!important}.film-control{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;min-width:104px;min-height:44px;padding:11px 18px;border:1px solid #a58b6880;border-radius:3px;color:#65472c;background:#fff6e7ed;font:11px/1.5 system-ui;letter-spacing:.16em;cursor:pointer}.film-control:hover{background:#fff8ed}.film-control:focus-visible{outline:2px solid #775432;outline-offset:4px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<main aria-label="Christmas in Rhythms opening film">
  <h1 class="sr-only">Christmas in Rhythms</h1>
  <img class="film-poster" src="./Christmas-in-Rhythms-coming-soon-poster.jpg" width="1920" height="1080" alt="Christmas in Rhythms — coming soon.">
  <video id="film" class="film-video" autoplay muted playsinline preload="metadata" poster="./Christmas-in-Rhythms-coming-soon-poster.jpg" aria-hidden="true" tabindex="-1">
    <source src="./Christmas-in-Rhythms-opening-near-v3.mp4" type="video/mp4">
  </video>
  <button id="playbackControl" class="film-control" type="button" aria-label="Replay video" hidden tabindex="-1">REPLAY</button>
  <p id="filmStatus" class="sr-only" role="status"></p>
</main>
<noscript><style>.film-video{display:none}</style></noscript>
<script>
(function(){
  'use strict';
  var film=document.getElementById('film');
  var control=document.getElementById('playbackControl');
  var status=document.getElementById('filmStatus');
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  var failed=false;
  var resumeAfterVisibility=false;
  function hideControl(){control.hidden=true;control.tabIndex=-1;}
  function showControl(text){control.textContent=text;control.setAttribute('aria-label',text==='REPLAY'?'Replay video':'Play video');control.hidden=false;control.tabIndex=0;}
  function failure(){failed=true;film.pause();film.classList.remove('has-played');hideControl();status.textContent='Video unavailable. The coming-soon image is displayed.';}
  async function play(){if(failed)return;hideControl();film.hidden=false;film.muted=true;try{await film.play();}catch(error){showControl('PLAY');status.textContent='Playback is paused. Select PLAY to start.';}}
  film.loop=false;
  film.muted=true;
  hideControl();
  film.addEventListener('playing',function(){film.classList.add('has-played');hideControl();status.textContent='';});
  film.addEventListener('ended',function(){showControl('REPLAY');status.textContent='Video finished. Select REPLAY to watch again.';});
  film.addEventListener('error',failure);
  film.querySelector('source').addEventListener('error',failure);
  control.addEventListener('click',function(){if(film.ended)film.currentTime=0;play();});
  function preferenceChanged(){if(reduced.matches){film.autoplay=false;film.pause();film.hidden=true;showControl('PLAY');}else if(!film.classList.contains('has-played'))play();}
  if(reduced.addEventListener)reduced.addEventListener('change',preferenceChanged);
  else if(reduced.addListener)reduced.addListener(preferenceChanged);
  document.addEventListener('visibilitychange',function(){if(document.hidden){resumeAfterVisibility=!film.paused&&!film.ended;film.pause();}else if(resumeAfterVisibility&&!reduced.matches){resumeAfterVisibility=false;play();}});
  if(reduced.matches)preferenceChanged();else play();
})();
</script>
</body>
</html>
