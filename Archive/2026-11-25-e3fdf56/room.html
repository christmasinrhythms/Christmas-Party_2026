      <h2 id="dressTitle" data-c="themes.title"></h2>

    </header>
    <div class="dress-grid">

        <img class="stylist" src="assets/room/elf.png" alt="">

        <div class="fig-wrap" id="figWrap"></div>
        <div class="platform"></div>
        <div class="sparkles" id="sparkles"></div>
        <div class="genre-picker" id="genrePicker" role="tablist"></div>
      </div>
      <div class="dress-info" id="dressInfo" aria-live="polite"></div>
    </div>
  </div>
</div>

<!-- ================= PANEL: REEL CHALLENGE ================= -->
<div class="panel" id="panel-reels" role="dialog" aria-modal="true" aria-labelledby="reelsTitle" hidden>
  <div class="panel-inner">
    <button class="close" type="button" data-close><span aria-hidden="true">×</span><span class="sr" data-ui="close">Close</span></button>
    <header class="p-head">
      <div class="ptabs" role="tablist">
        <button type="button" role="tab" data-switch="dress"><span class="rt-no">1</span><span data-c="hotspots.dress.label"></span></button>
        <button type="button" role="tab" data-switch="reels"><span class="rt-no">2</span><span data-c="hotspots.reels.label"></span></button>
      </div>
      <h2 id="reelsTitle" data-c="reels.title"></h2>
    </header>

    <div class="how">
      <div class="phone" id="howPhone">
        <div class="screen">
          <div class="rec"><i></i>REC <span id="howTimer">00:00</span></div>
          <div class="frame" id="howFrame"></div>
          <div class="ratio">9:16</div>
          <div class="progress"><span id="howBar"></span></div>
        </div>
      </div>
      <div class="how-right">
        <div class="rules">
          <p class="rules-tag" data-c="reels.rulesTitle"></p>
          <p class="rules-text" data-c="reels.rules"></p>
        </div>
        <div class="director"><img src="assets/room/snowman.png" alt=""><p class="say-inline" data-c="reels.snowmanSays"></p><img class="elf-buddy" src="assets/room/elf.png" alt=""></div>
      </div>
    </div>

    <h3 class="sub" data-c="reels.mvTitle"></h3>
    <div class="featured" id="mvFeatured"></div>
    <div class="mv card">
      <div class="lib-tabs" id="mvTabs" role="tablist"></div>
      <ul class="mv-list" id="mvList"></ul>
    </div>

    <div class="card tips"><h3 data-c="reels.tipsTitle"></h3><ul class="checks" id="reelTips"></ul></div>
  </div>
</div>

<!-- ================= PANEL: FLOOR PLAN ================= -->
<div class="panel" id="panel-plan" role="dialog" aria-modal="true" aria-labelledby="planTitle" hidden>
  <div class="panel-inner">
    <button class="close" type="button" data-close><span aria-hidden="true">×</span><span class="sr" data-ui="close">Close</span></button>
    <header class="p-head">
      <p class="kicker" data-ui="easel">On the easel</p>
      <h2 id="planTitle" data-c="floor.title"></h2>
      <p class="status-note"><span class="stamp" data-ui="tentative">Tentative</span> <span data-c="floor.status"></span></p>
      <p class="lede" data-c="floor.intro"></p>
    </header>
    <figure class="blueprint"><a id="floorLink" target="_blank" rel="noopener"><img id="floorImg" alt="Floor plan of the Grand Ballroom"><span class="zoom" data-ui="zoom">Open full size ↗</span></a></figure>
    <ul class="areas" id="floorAreas"></ul>
  </div>
</div>

<p class="updated"><span data-ui="updated">Last updated</span> <span data-c="lastUpdated"></span></p>

<div class="oops" id="oops" hidden><p data-ui="oops">Content is being updated — please check back in a few minutes.</p></div>

<!-- room.js loads room-content.js itself, always fresh, so edits show straight away -->
<script src="room.js?v=ballroom-20261125"></script>
</body>
</html>
