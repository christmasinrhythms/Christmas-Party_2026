<!doctype html>
<html lang="en" data-tryon-camera>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16100f">
  <meta name="description" content="Try on a Christmas look in your camera and save a photo or a short clip.">
  <title>Rock &amp; Punk 3D Camera · Christmas in Rhythms</title>
  <link rel="stylesheet" href="tryon.css?v=mirror-gestures-20261126">
  <link rel="stylesheet" href="tryon-studio.css?v=mirror-fit-20261126">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="assets/logo.png">
  <style>
    .back-link { white-space: nowrap; }
    .viewfinder:not(.has-source) {
      background: linear-gradient(transparent, var(--tryon-tint, #24100e) 86%), var(--tryon-room-art, url('assets/tryon/rock-3d/christmas-rock-frame.webp')) center / cover no-repeat, #24100e;
    }
  </style>
</head>
<body>
  <header class="studio-header">
    <a class="header-control back-link" id="back-link" href="index.html?room=rock"><span aria-hidden="true">‹</span><span data-text="back">Rock Room</span></a>
    <div class="studio-title">
      <img class="studio-crest" id="studio-crest" src="assets/interior/school-crest-rock.png" alt="">
      <h1 data-text="title">Try-on Camera</h1>
    </div>
    <button class="header-control language" id="language" type="button">繁中</button>
  </header>

  <main class="studio">
    <div class="camera-station">
      <section class="viewfinder" aria-label="Try-on preview" data-label="preview">
        <video id="camera-video" playsinline muted aria-hidden="true"></video>
        <canvas id="view" width="720" height="1280" aria-hidden="true"></canvas>
        <span class="live-dot" id="record-clock" hidden></span>
        <div class="welcome" id="welcome">
          <strong data-text="welcome">Your Christmas look</strong>
          <p data-text="framing">Keep both shoulders in view.</p>
          <div class="welcome-actions">
            <button id="start-camera" type="button" class="action" data-text="startCamera">Open camera</button>
            <button class="plain" id="welcome-gallery" type="button" data-text="gallery">Choose a photo</button>
          </div>
        </div>
      </section>
      <div class="camera-dock">
        <p class="view-status" id="status" aria-live="polite" role="status"></p>
        <div class="camera-actions" id="view-top" hidden>
          <button class="subtle reset-outfit" id="reset-mapping" type="button" data-text="resetMapping" data-label="resetOutfitLabel">Reset</button>
          <div class="camera-zoom" id="camera-zoom" role="group" data-label="zoom" aria-label="Camera zoom" hidden>
            <button type="button" data-camera-zoom="wide" data-text="wide" aria-pressed="true">Wide</button>
            <button type="button" data-camera-zoom="1" aria-pressed="false">1×</button>
            <button type="button" data-camera-zoom="2" aria-pressed="false">2×</button>
          </div>
          <button class="camera-icon" id="flip-camera" type="button" data-label="flip" aria-label="Flip camera" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5h9a4 4 0 0 1 4 4v1M8 2 5 5l3 3m10 11H9a4 4 0 0 1-4-4v-1m11 8 3-3-3-3"/></svg></button>
        </div>
        <div id="capture-controls" hidden>
          <button class="camera-icon" type="button" data-mode="photo" aria-pressed="true" data-label="photo" aria-label="Photo"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3"/></svg></button>
          <button type="button" class="shutter" id="shutter" aria-label="Take photo"><span aria-hidden="true"></span></button>
          <button class="camera-icon" type="button" data-mode="video" aria-pressed="false" data-label="video" aria-label="Video"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></svg></button>
        </div>
        <p class="gesture-hint" id="outfit-gesture-hint" data-text="gestureHint" hidden>Drag to move. Pinch to resize.</p>
      </div>
    </div>

    <section class="tools" aria-labelledby="looks-title">
      <div class="tools-heading">
        <h2 id="looks-title" data-text="looks">Looks</h2>
        <div class="source-options">
          <button type="button" class="subtle" id="back-to-camera" data-text="startCamera" hidden>Open camera</button>
          <button type="button" class="subtle" id="gallery-button" data-text="gallery">Choose a photo</button>
        </div>
        <input type="file" id="gallery-input" accept="image/*" hidden>
      </div>
      <div class="looks" id="look-list" role="group" aria-labelledby="looks-title"></div>
      <div class="switches">
        <label class="toggle"><input id="track-pose" type="checkbox" checked><span data-text="tracking">Follow shoulders</span></label>
        <label class="toggle" id="head-effect-control"><input id="show-face-paint" type="checkbox" checked><span data-text="facePaint">Face paint</span></label>
        <label class="toggle"><input id="show-frame" type="checkbox" checked><span data-text="frame">Christmas frame</span></label>
      </div>
      <p class="privacy" data-text="privacy">Photos and videos stay on this device.</p>
    </section>
  </main>

  <dialog id="result" aria-labelledby="result-title">
    <div class="result-header"><h2 id="result-title"></h2><button type="button" class="header-control" id="result-close" aria-label="Close" data-label="close">×</button></div>
    <img id="result-photo" hidden alt="Captured try-on photo" data-alt="capturedPhoto">
    <video id="result-video" hidden controls playsinline></video>
    <div class="result-actions">
      <a class="action" id="download" download data-text="download">Download</a>
      <button class="header-control" id="share" type="button" data-text="share" hidden>Share</button>
    </div>
  </dialog>
  <script type="importmap">
    {"imports":{"three":"./assets/tryon/vendor/three/three.module.min.js"}}
  </script>
  <script type="module" src="tryon.mjs?v=mirror-gestures-20261126"></script>
</body>
</html>
